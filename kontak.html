<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kontak - Warung Teh Tia</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* 🎨 THEME */
:root{
  --bg1:#fff3d6;
  --bg2:#ffe6a1;
  --card:rgba(255,255,255,0.75);
  --text:#222;
  --sub:#666;
  --primary:#ff9800;
}

body.dark{
  --bg1:#0f0f0f;
  --bg2:#1a1a1a;
  --card:rgba(30,30,30,0.75);
  --text:#f5f5f5;
  --sub:#aaa;
}

/* 🌍 BASE */
body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--text);
  transition:0.4s;
}

/* 🧠 HEADER PREMIUM */
header{
  text-align:center;
  padding:28px;
  font-size:28px;
  font-weight:700;
  color:white;
  background:linear-gradient(135deg,#ff9800,#ffb347);
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  border-bottom-left-radius:25px;
  border-bottom-right-radius:25px;
}

/* 🧊 TOPBAR GLASS */
.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  padding:15px;

  position:sticky;
  top:0;
  z-index:100;

  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.2);
}

body.dark .topbar{
  background:rgba(20,20,20,0.4);
}

/* 🔘 BUTTON */
.navBtn{
  padding:10px 14px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  text-decoration:none;
  font-weight:600;
  color:white;

  background:linear-gradient(135deg,var(--primary),#ffb347);
  box-shadow:0 6px 15px rgba(0,0,0,0.15);
  transition:0.25s;
}

.navBtn:hover{
  transform:translateY(-3px) scale(1.03);
}

/* 📦 CONTAINER */
.container{
  padding:30px;
  display:flex;
  justify-content:center;
}

/* 🧊 CARD GLASS */
.card{
  width:100%;
  max-width:720px;
  padding:35px;
  border-radius:25px;

  background:var(--card);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.3);

  box-shadow:0 15px 40px rgba(0,0,0,0.25);
  text-align:center;
}

/* TEXT */
h1{
  font-size:28px;
  margin-bottom:15px;
}

p{
  font-size:16px;
  opacity:0.85;
}

/* CONTACT BOX */
.contactBox{
  margin-top:25px;
  text-align:left;
}

.contactItem{
  background:rgba(255,152,0,0.12);
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;

  font-size:17px;
  font-weight:500;

  transition:0.2s;
}

.contactItem:hover{
  transform:translateX(5px);
}

/* FOOTER */
footer{
  margin-top:50px;
  background:#222;
  color:white;
  text-align:center;
  padding:20px;
}

/* SELECT */
select{
  padding:10px;
  border:none;
  border-radius:12px;
  font-weight:600;
}

</style>
</head>

<body>

<header id="title">📞 Kontak Kami</header>

<div class="topbar">

<a href="index.html" class="navBtn">🏠 Home</a>
<a href="beli.html" class="navBtn">🛒 Beli</a>
<a href="keranjang.html" class="navBtn">🛍️ Keranjang</a>

<button class="navBtn" onclick="toggleDark()">🌙</button>

<select class="navBtn" onchange="changeLang(this.value)" id="langSelect">
<option value="id">🇮🇩 ID</option>
<option value="en">🇺🇸 EN</option>
<option value="jp">🇯🇵 JP</option>
<option value="ar">🇸🇦 AR</option>
<option value="ru">🇷🇺 RU</option>
</select>

<select class="navBtn" onchange="changeColorblind(this.value)" id="cbSelect">
<option value="normal">Normal</option>
<option value="protanopia">Protanopia</option>
<option value="deuteranopia">Deuteranopia</option>
<option value="tritanopia">Tritanopia</option>
</select>

</div>

<div class="container">

<div class="card">

<h1 id="welcome">Hubungi Kami 📞</h1>
<p id="desc">Customer support aktif 24/7 (bohong dikit gapapa 😤🔥)</p>

<div class="contactBox">

<div class="contactItem" id="c1">📱 WhatsApp: +62 858-2002-8734</div>
<div class="contactItem" id="c2">📧 Email: omarlubis49@gmail.com</div>
<div class="contactItem" id="c3">📍 Lokasi: Indonesia</div>
<div class="contactItem" id="c4">⏰ Jam Operasional: 07:00 - 21:00</div>

</div>

</div>

</div>

<footer>© 2026 Warung Teh Tia. Created by RoomieeG-bit.</footer>

<script>

/* 🌍 STATE */
let lang = localStorage.getItem("lang") || "id";
let colorblind = localStorage.getItem("colorblind") || "normal";
let dark = localStorage.getItem("dark") || "off";

if(dark === "on") document.body.classList.add("dark");

/* 🌐 TEXT */
const text = {
id:{
title:"📞 Kontak Kami",
welcome:"Hubungi Kami 📞",
desc:"Customer support aktif 24/7 🔥",
c1:"📱 WhatsApp: +62 858-2002-8734",
c2:"📧 Email: omarlubis49@gmail.com",
c3:"📍 Lokasi: Indonesia",
c4:"⏰ Jam Operasional: 07:00 - 21:00"
},
en:{
title:"📞 Contact Us",
welcome:"Contact Us 📞",
desc:"Customer support active 24/7 🔥",
c1:"📱 WhatsApp: +62 858-2002-8734",
c2:"📧 Email: omarlubis49@gmail.com",
c3:"📍 Location: Indonesia",
c4:"⏰ Open: 07:00 - 21:00"
},
jp:{
title:"📞 連絡先",
welcome:"お問い合わせ 📞",
desc:"サポート24時間対応 🔥",
c1:"📱 WhatsApp: +62 858-2002-8734",
c2:"📧 メール: omarlubis49@gmail.com",
c3:"📍 場所: インドネシア",
c4:"⏰ 営業時間: 07:00 - 21:00"
},
ar:{
title:"📞 اتصل بنا",
welcome:"تواصل معنا 📞",
desc:"دعم العملاء 24/7 🔥",
c1:"📱 واتساب: +62 858-2002-8734",
c2:"📧 بريد: omarlubis49@gmail.com",
c3:"📍 الموقع: إندونيسيا",
c4:"⏰ ساعات العمل: 07:00 - 21:00"
},
ru:{
title:"📞 Контакты",
welcome:"Связаться с нами 📞",
desc:"Поддержка 24/7 🔥",
c1:"📱 WhatsApp: +62 858-2002-8734",
c2:"📧 Email: omarlubis49@gmail.com",
c3:"📍 Место: Индонезия",
c4:"⏰ Время: 07:00 - 21:00"
}
};

/* 🧠 APPLY */
function applyAll(){

let t = text[lang];

document.getElementById("title").innerText = t.title;
document.getElementById("welcome").innerText = t.welcome;
document.getElementById("desc").innerText = t.desc;

document.getElementById("c1").innerText = t.c1;
document.getElementById("c2").innerText = t.c2;
document.getElementById("c3").innerText = t.c3;
document.getElementById("c4").innerText = t.c4;

localStorage.setItem("lang",lang);
}

/* 🌍 LANG */
function changeLang(v){
lang = v;
applyAll();
}

/* 🌙 DARK */
function toggleDark(){
document.body.classList.toggle("dark");
localStorage.setItem("dark",
document.body.classList.contains("dark") ? "on" : "off");
}

/* 🎨 COLORBLIND */
function changeColorblind(v){
colorblind = v;
localStorage.setItem("colorblind", v);

document.body.classList.remove("protanopia","deuteranopia","tritanopia");

if(v !== "normal"){
document.body.classList.add(v);
}
}

/* INIT */
document.getElementById("langSelect").value = lang;
document.getElementById("cbSelect").value = colorblind;

if(colorblind !== "normal"){
document.body.classList.add(colorblind);
}

applyAll();

</script>

</body>
</html>
