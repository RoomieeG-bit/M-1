<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rating - Warung Teh Tia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg1:#fff3d6;
  --bg2:#ffe6a1;
  --card:rgba(255,255,255,0.75);
  --text:#222;
  --sub:#666;
  --primary:#ff9800;
}

body.dark{
  --bg1:#0f0f0f;
  --bg2:#1a1a1a;
  --card:rgba(30,30,30,0.75);
  --text:#f5f5f5;
  --sub:#aaa;
}

body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--text);
  transition:0.4s;
}

/* HEADER */
header{
  text-align:center;
  padding:28px;
  font-size:28px;
  font-weight:700;
  color:white;
  background:linear-gradient(135deg,#ff9800,#ffb347);
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  border-bottom-left-radius:25px;
  border-bottom-right-radius:25px;
}

/* TOPBAR */
.topbar{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  padding:15px;

  position:sticky;
  top:0;
  z-index:100;

  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.2);
}

body.dark .topbar{
  background:rgba(20,20,20,0.4);
}

/* BUTTON */
.btn{
  padding:10px 14px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  text-decoration:none;
  color:white;
  font-weight:600;

  background:linear-gradient(135deg,var(--primary),#ffb347);
  box-shadow:0 6px 15px rgba(0,0,0,0.15);
  transition:0.25s;
}

.btn:hover{
  transform:translateY(-3px) scale(1.03);
  box-shadow:0 12px 25px rgba(0,0,0,0.25);
}

/* CONTAINER */
.container{
  display:flex;
  justify-content:center;
  padding:35px 20px;
}

/* CARD */
.card{
  width:100%;
  max-width:650px;

  background:var(--card);
  backdrop-filter:blur(10px);

  border-radius:28px;
  padding:35px;

  text-align:center;

  border:1px solid rgba(255,255,255,0.3);

  box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

/* EMOJI RATING */
.ratingBox{
  margin-top:30px;
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}

.rateEmoji{
  font-size:55px;
  cursor:pointer;
  transition:0.25s;
  opacity:0.45;
  user-select:none;
}

.rateEmoji.active{
  opacity:1;
  transform:scale(1.15);
}

.rateEmoji:hover{
  transform:scale(1.2) rotate(5deg);
}

/* LABEL */
#ratingLabel{
  margin-top:20px;
  font-size:22px;
  font-weight:700;
  color:var(--primary);
}

/* TEXTAREA */
textarea{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:none;
  border-radius:16px;
  resize:none;
  height:130px;
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
  outline:none;
}

/* RESULT */
#hasil{
  margin-top:20px;
  font-weight:600;
  color:var(--primary);
}

</style>
</head>

<body>

<header id="title">🎯 Rating Warung Teh Tia</header>

<div class="topbar">

<a href="index.html" class="btn" id="backBtn">⬅ Kembali</a>

<button onclick="toggleDark()" class="btn">🌙</button>

<select onchange="changeLang(this.value)" id="langSelect" class="btn">
<option value="id">🇮🇩 ID</option>
<option value="en">🇺🇸 EN</option>
<option value="jp">🇯🇵 JP</option>
<option value="ar">🇸🇦 AR</option>
<option value="ru">🇷🇺 RU</option>
</select>

</div>

<div class="container">

<div class="card">

<h1 id="welcome">Kasih Rating 🔥</h1>

<p id="desc">
Pilih emoji sesuai pengalaman lu 😎
</p>

<div class="ratingBox">

<span class="rateEmoji" onclick="setRating(1)">😫</span>
<span class="rateEmoji" onclick="setRating(2)">🙁</span>
<span class="rateEmoji" onclick="setRating(3)">😐</span>
<span class="rateEmoji" onclick="setRating(4)">😃</span>
<span class="rateEmoji" onclick="setRating(5)">😁</span>

</div>

<div id="ratingLabel">Belum pilih rating</div>

<textarea id="review" placeholder="Tulis review lu disini..."></textarea>

<br>

<button class="btn" onclick="kirimRating()" id="sendBtn">
🚀 Kirim Rating
</button>

<div id="hasil"></div>

</div>

</div>

<script>

/* SETTINGS */
let lang = localStorage.getItem("lang") || "id";
let dark = localStorage.getItem("dark") || "off";

if(dark === "on"){
  document.body.classList.add("dark");
}

/* RATING */
let currentRating = localStorage.getItem("ratingEmoji") || 0;

/* LABEL EMOJI */
const emojiText = {
1:"😫 I don't like the service!",
2:"🙁 I'm bored...",
3:"😐 Good i think",
4:"😃 So good!",
5:"😁 THIS IS GOOD!"
};

/* TEXT */
const text = {

id:{
title:"🎯 Rating Warung Teh Tia",
back:"⬅ Kembali",
welcome:"Kasih Rating 🔥",
desc:"Pilih emoji sesuai pengalaman lu 😎",
placeholder:"Tulis review lu disini...",
send:"🚀 Kirim Rating",
done:"Rating berhasil dikirim 🔥",
empty:"Pilih rating dulu 🔥",
norating:"Belum pilih rating"
},

en:{
title:"🎯 Teh Tia Rating",
back:"⬅ Back",
welcome:"Give Rating 🔥",
desc:"Choose emoji based on your experience 😎",
placeholder:"Write your review here...",
send:"🚀 Send Rating",
done:"Rating sent successfully 🔥",
empty:"Choose rating first 🔥",
norating:"No rating selected"
},

jp:{
title:"🎯 レビュー",
back:"⬅ 戻る",
welcome:"評価してください 🔥",
desc:"体験に合わせて絵文字を選んでください 😎",
placeholder:"レビューを書いてください...",
send:"🚀 送信",
done:"送信成功 🔥",
empty:"先に評価してください 🔥",
norating:"未選択"
},

ar:{
title:"🎯 التقييم",
back:"⬅ رجوع",
welcome:"أضف تقييم 🔥",
desc:"اختر الإيموجي حسب تجربتك 😎",
placeholder:"اكتب رأيك هنا...",
send:"🚀 إرسال",
done:"تم الإرسال 🔥",
empty:"اختر تقييم أولاً 🔥",
norating:"لا يوجد تقييم"
},

ru:{
title:"🎯 Рейтинг",
back:"⬅ Назад",
welcome:"Оставьте рейтинг 🔥",
desc:"Выберите эмодзи 😎",
placeholder:"Напишите отзыв...",
send:"🚀 Отправить",
done:"Отправлено 🔥",
empty:"Сначала выберите рейтинг 🔥",
norating:"Рейтинг не выбран"
}

};

/* APPLY LANG */
function applyLang(){

let t = text[lang];

document.getElementById("title").innerText = t.title;
document.getElementById("backBtn").innerText = t.back;
document.getElementById("welcome").innerText = t.welcome;
document.getElementById("desc").innerText = t.desc;
document.getElementById("review").placeholder = t.placeholder;
document.getElementById("sendBtn").innerText = t.send;

if(currentRating == 0){
document.getElementById("ratingLabel").innerText = t.norating;
}

localStorage.setItem("lang",lang);

}

/* DARK */
function toggleDark(){

document.body.classList.toggle("dark");

localStorage.setItem(
"dark",
document.body.classList.contains("dark")
? "on"
: "off"
);

}

/* LANG */
function changeLang(v){

lang = v;

applyLang();

}

/* SET RATING */
function setRating(num){

currentRating = num;

localStorage.setItem("ratingEmoji",num);

document.querySelectorAll(".rateEmoji").forEach((emoji,index)=>{

if(index < num){
emoji.classList.add("active");
}else{
emoji.classList.remove("active");
}

});

document.getElementById("ratingLabel").innerText =
emojiText[num];

}

/* SEND */
function kirimRating(){

if(currentRating == 0){

alert(text[lang].empty);

return;

}

let review = document.getElementById("review").value;

localStorage.setItem("ratingReview",review);

let emoji = ["😫","🙁","😐","🙂","😃","😁"][currentRating];

let pesan =
`🎯 RATING BARU%0A%0A` +
`${emoji} Rating: ${currentRating}/5%0A` +
`🏷️ Status: ${emojiText[currentRating]}%0A%0A` +
`📝 Review:%0A${review}`;

document.getElementById("hasil").innerText =
text[lang].done;

alert(text[lang].done);

location.href =
`https://wa.me/6285820028734?text=${pesan}`;

}

/* INIT */
document.getElementById("langSelect").value = lang;

applyLang();

if(currentRating > 0){
setRating(currentRating);
}

</script>

</body>
</html>
