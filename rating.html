<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rating - Warung Teh Tia</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* 🎨 THEME */
:root{
  --bg1:#fff3d6;
  --bg2:#ffe6a1;
  --card:rgba(255,255,255,0.75);
  --text:#222;
  --sub:#666;
  --primary:#ff9800;
}

body.dark{
  --bg1:#0f0f0f;
  --bg2:#1a1a1a;
  --card:rgba(30,30,30,0.75);
  --text:#f5f5f5;
  --sub:#aaa;
}

/* 🌍 BASE */
body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--text);
  transition:0.4s;
}

/* 🔥 HEADER */
header{
  text-align:center;
  padding:28px;
  font-size:28px;
  font-weight:700;
  color:white;
  background:linear-gradient(135deg,#ff9800,#ffb347);
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  border-bottom-left-radius:25px;
  border-bottom-right-radius:25px;
}

/* 🧊 TOPBAR */
.topbar{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  padding:15px;

  position:sticky;
  top:0;
  z-index:100;

  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(12px);
}

body.dark .topbar{
  background:rgba(20,20,20,0.4);
}

/* 🔘 BUTTON */
.btn{
  padding:10px 14px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  text-decoration:none;
  color:white;
  font-weight:600;

  background:linear-gradient(135deg,var(--primary),#ffb347);
  box-shadow:0 6px 15px rgba(0,0,0,0.15);

  transition:0.25s;
}

.btn:hover{
  transform:translateY(-3px);
}

/* 📦 CONTAINER */
.container{
  padding:30px;
  display:flex;
  justify-content:center;
}

/* 🧊 CARD */
.card{
  width:100%;
  max-width:650px;

  background:var(--card);
  backdrop-filter:blur(10px);

  padding:35px;
  border-radius:30px;

  box-shadow:0 12px 30px rgba(0,0,0,0.2);

  text-align:center;
}

/* ⭐ STAR */
.starWrap{
  margin-top:25px;
  font-size:55px;
}

.star{
  cursor:pointer;
  transition:0.2s;
  opacity:0.4;
}

.star:hover{
  transform:scale(1.2);
}

.star.active{
  opacity:1;
}

/* 📝 TEXTAREA */
textarea{
  width:100%;
  height:130px;

  margin-top:25px;
  padding:15px;

  border:none;
  border-radius:18px;

  resize:none;

  box-sizing:border-box;

  font-family:Poppins,sans-serif;
  font-size:15px;

  background:rgba(255,255,255,0.8);
}

body.dark textarea{
  background:#222;
  color:white;
}

/* 📊 RESULT */
.result{
  margin-top:25px;
  font-size:20px;
  font-weight:600;
}

.footer{
  text-align:center;
  padding:25px;
  color:var(--sub);
}

</style>
</head>

<body>

<header id="title">
⭐ Rating Warung Teh Tia
</header>

<div class="topbar">

<a href="index.html" class="btn" id="homeBtn">
🏠 Home
</a>

<a href="beli.html" class="btn" id="buyBtn">
🛒 Beli
</a>

<a href="keranjang.html" class="btn" id="cartBtn">
🛍️ Keranjang
</a>

<select onchange="changeLang(this.value)" id="langSelect" class="btn">
<option value="id">🇮🇩 ID</option>
<option value="en">🇺🇸 EN</option>
<option value="jp">🇯🇵 JP</option>
<option value="ar">🇸🇦 AR</option>
<option value="ru">🇷🇺 RU</option>
</select>

<button onclick="toggleDark()" class="btn">
🌙
</button>

</div>

<div class="container">

<div class="card">

<h1 id="head">
Kasih Rating 🔥
</h1>

<p id="desc">
Pilih berapa bintang untuk Warung Teh Tia 😎
</p>

<div class="starWrap">

<span class="star" onclick="setRating(1)">⭐</span>
<span class="star" onclick="setRating(2)">⭐</span>
<span class="star" onclick="setRating(3)">⭐</span>
<span class="star" onclick="setRating(4)">⭐</span>
<span class="star" onclick="setRating(5)">⭐</span>

</div>

<textarea id="komen" placeholder="Tulis komentar..."></textarea>

<br><br>

<button class="btn" onclick="kirimRating()" id="sendBtn">
🚀 Kirim Rating
</button>

<div class="result" id="result">
Belum ada rating 👀
</div>

</div>

</div>

<div class="footer">
© 2026 Warung Teh Tia ⭐
</div>

<script>

/* ⚙️ STATE */
let lang = localStorage.getItem("lang") || "id";
let dark = localStorage.getItem("dark") || "off";
let rating = 0;

if(dark === "on"){
  document.body.classList.add("dark");
}

/* 🌍 TEXT */
const text = {

id:{
  title:"⭐ Rating Warung Teh Tia",
  head:"Kasih Rating 🔥",
  desc:"Pilih berapa bintang untuk Warung Teh Tia 😎",
  send:"🚀 Kirim Rating",
  result:"Belum ada rating 👀",
  placeholder:"Tulis komentar...",
  thanks:"Makasih udah kasih",
  star:"bintang ⭐"
},

en:{
  title:"⭐ Teh Tia Rating",
  head:"Give Rating 🔥",
  desc:"Choose stars for Teh Tia Shop 😎",
  send:"🚀 Send Rating",
  result:"No rating yet 👀",
  placeholder:"Write comment...",
  thanks:"Thanks for giving",
  star:"stars ⭐"
},

jp:{
  title:"⭐ レビュー",
  head:"評価してください 🔥",
  desc:"星を選択してください 😎",
  send:"🚀 送信",
  result:"まだ評価なし 👀",
  placeholder:"コメントを書く...",
  thanks:"ありがとうございます",
  star:"星 ⭐"
},

ar:{
  title:"⭐ التقييم",
  head:"أعط تقييم 🔥",
  desc:"اختر عدد النجوم 😎",
  send:"🚀 إرسال",
  result:"لا يوجد تقييم 👀",
  placeholder:"اكتب تعليق...",
  thanks:"شكراً لك",
  star:"نجوم ⭐"
},

ru:{
  title:"⭐ Рейтинг",
  head:"Оцените 🔥",
  desc:"Выберите звезды 😎",
  send:"🚀 Отправить",
  result:"Нет оценки 👀",
  placeholder:"Написать комментарий...",
  thanks:"Спасибо за",
  star:"звезд ⭐"
}

};

/* ⭐ SET RATING */
function setRating(num){

  rating = num;

  document.querySelectorAll(".star").forEach((s,index)=>{

    if(index < num){
      s.classList.add("active");
    }else{
      s.classList.remove("active");
    }

  });

}

/* 🚀 SEND */
function kirimRating(){

  if(rating === 0){
    alert("Pilih bintang dulu 🔥");
    return;
  }

  let komentar = document.getElementById("komen").value;

  localStorage.setItem("rating",rating);
  localStorage.setItem("komentar",komentar);

  document.getElementById("result").innerHTML =
  `${text[lang].thanks} <br><br> ${rating} ${text[lang].star}`;

}

/* 🌍 LANG */
function changeLang(v){

  lang = v;

  localStorage.setItem("lang",lang);

  applyLang();

}

/* 🌙 DARK */
function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "dark",
    document.body.classList.contains("dark")
    ? "on"
    : "off"
  );

}

/* 🌍 APPLY */
function applyLang(){

  let t = text[lang];

  document.getElementById("title").innerText = t.title;
  document.getElementById("head").innerText = t.head;
  document.getElementById("desc").innerText = t.desc;
  document.getElementById("sendBtn").innerText = t.send;
  document.getElementById("komen").placeholder = t.placeholder;

}

/* INIT */
document.getElementById("langSelect").value = lang;

applyLang();

</script>

</body>
  </html>
