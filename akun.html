<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akun - Warung Teh Tia</title>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff8e7;
  text-align:center;
}

header{
  background:#ff9800;
  color:white;
  padding:25px;
  font-size:28px;
  font-weight:bold;
}

.card{
  max-width:420px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#ff9800;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#e68900;
}

.topbar{
  margin-top:10px;
}

.back-btn,
.lang-btn{
  display:inline-block;
  margin:8px 5px;
  padding:10px 16px;
  background:#ff9800;
  color:white;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
}

.g-recaptcha{
  margin-top:10px;
  display:flex;
  justify-content:center;
}

#status{
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<header id="title">👤 Akun Warung Teh Tia</header>

<div class="topbar">

<a href="index.html" class="back-btn" id="backBtn">⬅ Kembali</a>

<button class="lang-btn" onclick="toggleLang()" id="langBtn">
🌐 Ganti Bahasa
</button>

</div>

<div class="card">

<h2 id="h2">Login / Register</h2>

<input id="username" type="text" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<!-- 🔥 CAPTCHA -->
<div class="g-recaptcha"
data-sitekey="6LdAyvksAAAAAIGFI3m7_CUbHznN46LZGAIVerE-"></div>

<button onclick="register()" id="btnReg">Daftar 🆕</button>
<button onclick="login()" id="btnLogin">Login 🔑</button>
<button onclick="logout()" id="btnLogout">Logout 🚪</button>

<div id="status">Loading...</div>

</div>

<script>

let lang = localStorage.getItem("lang") || "id";

/* 🌐 MULTILANG */
const text = {
  id:{back:"⬅ Kembali",lang:"🌐 Ganti Bahasa",title:"👤 Akun",h2:"Login / Register",reg:"Daftar 🆕",login:"Login 🔑",logout:"Logout 🚪",status:"BELUM LOGIN ❌",ok:"LOGIN SEBAGAI 😎"},
  en:{back:"⬅ Back",lang:"🌐 Language",title:"👤 Account",h2:"Login / Register",reg:"Register 🆕",login:"Login 🔑",logout:"Logout 🚪",status:"NOT LOGGED IN ❌",ok:"LOGGED IN 😎"},
  jp:{back:"⬅ 戻る",lang:"🌐 言語",title:"👤 アカウント",h2:"ログイン / 登録",reg:"登録 🆕",login:"ログイン 🔑",logout:"ログアウト 🚪",status:"未ログイン ❌",ok:"ログイン中 😎"},
  ar:{back:"⬅ رجوع",lang:"🌐 اللغة",title:"👤 الحساب",h2:"تسجيل / دخول",reg:"تسجيل 🆕",login:"دخول 🔑",logout:"خروج 🚪",status:"غير مسجل ❌",ok:"تم تسجيل الدخول 😎"},
  ru:{back:"⬅ Назад",lang:"🌐 Язык",title:"👤 Аккаунт",h2:"Вход / Регистрация",reg:"Регистрация 🆕",login:"Войти 🔑",logout:"Выйти 🚪",status:"НЕ ВОШЕЛ ❌",ok:"ВЫ ВОШЛИ 😎"}
};

/* 🔥 CAPTCHA CHECK */
function captchaOK(){
  return grecaptcha.getResponse().length > 0;
}

function applyLang(){

document.getElementById("backBtn").innerText=text[lang].back;
document.getElementById("langBtn").innerText=text[lang].lang;
document.getElementById("title").innerText=text[lang].title;
document.getElementById("h2").innerText=text[lang].h2;

document.getElementById("btnReg").innerText=text[lang].reg;
document.getElementById("btnLogin").innerText=text[lang].login;
document.getElementById("btnLogout").innerText=text[lang].logout;

localStorage.setItem("lang",lang);

updateStatus();

}

function toggleLang(){
const order=["id","en","jp","ar","ru"];
let i=order.indexOf(lang);
lang=order[(i+1)%order.length];
applyLang();
}

/* 🔥 REGISTER */
function register(){

if(!captchaOK()){
alert("CAPTCHA DULU 🔥");
return;
}

let u=document.getElementById("username").value.trim();
let p=document.getElementById("password").value;

if(!u||!p){
alert("ISI DULU 🔥");
return;
}

localStorage.setItem("user",u);
localStorage.setItem("pass",p);

grecaptcha.reset();

alert("REGISTER BERHASIL 🔥");

}

/* 🔥 LOGIN */
function login(){

if(!captchaOK()){
alert("CAPTCHA DULU 🔥");
return;
}

let u=document.getElementById("username").value.trim();
let p=document.getElementById("password").value;

if(u===localStorage.getItem("user") &&
p===localStorage.getItem("pass")){

localStorage.setItem("login","true");
localStorage.setItem("currentUser",u);

alert("LOGIN BERHASIL 😎");

}else{
alert("SALAH USER / PASS 💀");
}

grecaptcha.reset();

updateStatus();

}

/* 🔥 LOGOUT */
function logout(){

localStorage.removeItem("login");
localStorage.removeItem("currentUser");

alert("LOGOUT 🔥");

updateStatus();

}

/* 🔥 STATUS */
function updateStatus(){

let status=document.getElementById("status");

if(localStorage.getItem("login")==="true"){
status.innerHTML=text[lang].ok+"<br><br>"+localStorage.getItem("currentUser");
}else{
status.innerHTML=text[lang].status;
}

}

applyLang();

</script>

</body>
</html>
