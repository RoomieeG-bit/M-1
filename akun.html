<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akun - Warung Teh Tia</title>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff8e7;
  text-align:center;
}

header{
  background:#ff9800;
  color:white;
  padding:25px;
  font-size:30px;
  font-weight:bold;
}

.card{
  max-width:420px;
  margin:40px auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#ff9800;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#e68900;
}

#status{
  margin-top:20px;
  font-weight:bold;
}

.g-recaptcha{
  margin-top:10px;
  display:flex;
  justify-content:center;
}

</style>
</head>

<body>

<header>👤 Akun Warung Teh Tia</header>

<div class="card">

<h2>Login / Register 🔥</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<!-- CAPTCHA -->
<div class="g-recaptcha"
data-sitekey="6LdAyvksAAAAAIGFI3m7_CUbHznN46LZGAIVerE-"></div>

<button onclick="register()">Daftar 🆕</button>
<button onclick="login()">Login 🔑</button>
<button onclick="logout()">Logout 🚪</button>

<div id="status">Loading...</div>

</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDFJxpGTfvL7YVuTfDh8iNd9qKIBwjjLXQ",
  authDomain: "warung-teh-tia.firebaseapp.com",
  projectId: "warung-teh-tia",
  storageBucket: "warung-teh-tia.firebasestorage.app",
  messagingSenderId: "230262012309",
  appId: "1:230262012309:web:254412772aa803c0815e9c",
  measurementId: "G-9P43TMREGH"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* CAPTCHA CHECK */
function captchaOK(){
  return grecaptcha.getResponse().length > 0;
}

/* CLEAN EMAIL */
function getEmail(){
  return document.getElementById("email")
    .value
    .trim()
    .replace(/\s/g,'');
}

/* PASSWORD */
function getPassword(){
  return document.getElementById("password").value;
}

/* REGISTER */
window.register = async function(){

if(!captchaOK()){
alert("CAPTCHA dulu 🔥");
return;
}

let email = getEmail();
let password = getPassword();

if(!email.includes("@")){
alert("EMAIL GAK VALID 🔥");
return;
}

try{
await createUserWithEmailAndPassword(auth, email, password);
alert("DAFTAR BERHASIL 🔥");
grecaptcha.reset();
}catch(e){
alert(e.code);
}

}

/* LOGIN */
window.login = async function(){

if(!captchaOK()){
alert("CAPTCHA dulu 🔥");
return;
}

let email = getEmail();
let password = getPassword();

if(!email.includes("@")){
alert("EMAIL GAK VALID 🔥");
return;
}

try{
await signInWithEmailAndPassword(auth, email, password);
alert("LOGIN BERHASIL 😎");
grecaptcha.reset();
}catch(e){
alert(e.code);
}

}

/* LOGOUT */
window.logout = async function(){
await signOut(auth);
alert("LOGOUT 🔥");
}

/* STATUS */
onAuthStateChanged(auth, (user)=>{

let status = document.getElementById("status");

if(user){
status.innerHTML =
"LOGIN SEBAGAI 😎<br><br>" + user.email;
}else{
status.innerHTML =
"BELUM LOGIN ❌";
}

});

</script>

</body>
</html>
