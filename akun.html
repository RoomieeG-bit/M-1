<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Akun - Warung Teh Tia</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>

/* 🎨 THEME */
:root{
  --bg1:#fff3d6;
  --bg2:#ffe6a1;
  --card:rgba(255,255,255,0.75);
  --text:#222;
  --sub:#666;
  --primary:#ff9800;
}

body.dark{
  --bg1:#0f0f0f;
  --bg2:#1a1a1a;
  --card:rgba(30,30,30,0.75);
  --text:#f5f5f5;
  --sub:#aaa;
}

/* 🌍 BASE */
body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--text);
  transition:0.4s;
}

/* 🧠 HEADER PREMIUM */
header{
  text-align:center;
  padding:28px;
  font-size:28px;
  font-weight:700;
  color:white;
  background:linear-gradient(135deg,#ff9800,#ffb347);
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  border-bottom-left-radius:25px;
  border-bottom-right-radius:25px;
}

/* 🧊 TOPBAR GLASS */
.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  padding:15px;

  position:sticky;
  top:0;
  z-index:100;

  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.2);
}

body.dark .topbar{
  background:rgba(20,20,20,0.4);
}

/* 🔘 BUTTON */
.navBtn{
  padding:10px 14px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  text-decoration:none;
  color:white;
  font-weight:600;

  background:linear-gradient(135deg,var(--primary),#ffb347);
  box-shadow:0 6px 15px rgba(0,0,0,0.15);
  transition:0.25s;
}

.navBtn:hover{
  transform:translateY(-3px) scale(1.03);
}

/* 📦 CONTAINER */
.container{
  padding:30px;
  display:flex;
  justify-content:center;
}

/* 🧊 CARD GLASS */
.card{
  width:100%;
  max-width:520px;
  padding:35px;
  border-radius:25px;

  background:var(--card);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.3);

  box-shadow:0 15px 40px rgba(0,0,0,0.25);
  text-align:center;
}

/* INPUT */
input{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  outline:none;
  font-size:15px;
}

/* BUTTON */
.btn{
  width:100%;
  margin-top:15px;
  padding:14px;
  border:none;
  border-radius:14px;
  cursor:pointer;

  color:white;
  font-weight:700;

  background:linear-gradient(135deg,#ff9800,#ffb347);
  box-shadow:0 10px 20px rgba(255,152,0,0.25);
  transition:0.25s;
}

.btn:hover{
  transform:translateY(-3px);
}

/* CAPTCHA */
.cf-turnstile{
  margin-top:18px;
  display:flex;
  justify-content:center;
}

/* STATUS */
#hasil{
  margin-top:18px;
  font-weight:700;
}

p{
  opacity:0.85;
}

</style>
</head>

<body>

<header id="title">👤 Akun Warung Teh Tia</header>

<div class="topbar">

<a href="index.html" class="navBtn" id="backBtn">⬅ Kembali</a>
<button class="navBtn" onclick="toggleDark()">🌙</button>

<select class="navBtn" onchange="changeLang(this.value)" id="langSelect">
<option value="id">🇮🇩 ID</option>
<option value="en">🇺🇸 EN</option>
<option value="jp">🇯🇵 JP</option>
<option value="ar">🇸🇦 AR</option>
<option value="ru">🇷🇺 RU</option>
</select>

</div>

<div class="container">

<div class="card">

<h1 id="welcome">Buat Akun 🔥</h1>
<p id="desc">Simpan akun ke LocalStorage 😎</p>

<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">

<div class="cf-turnstile"
data-sitekey="0x4AAAAAADWozkOth1c1sT1G"
data-theme="light"></div>

<button class="btn" onclick="buatAkun()" id="saveBtn">
💾 Simpan Akun
</button>

<button class="btn" onclick="logout()" id="logoutBtn">
🚪 Logout
</button>

<div id="hasil"></div>

</div>

</div>

<script>

/* 🌍 STATE */
let lang = localStorage.getItem("lang") || "id";
let dark = localStorage.getItem("dark") || "off";

if(dark === "on") document.body.classList.add("dark");

/* 🌐 TEXT */
const text = {
id:{
title:"👤 Akun Warung Teh Tia",
welcome:"Buat Akun 🔥",
desc:"Simpan akun ke LocalStorage 😎",
save:"💾 Simpan Akun",
logout:"🚪 Logout",
back:"⬅ Kembali",
nologin:"Belum Login ❌",
logged:"LOGIN SEBAGAI 😎",
captcha:"Selesaikan CAPTCHA dulu 🔥"
},
en:{
title:"👤 Account",
welcome:"Create Account 🔥",
desc:"Save account to LocalStorage 😎",
save:"💾 Save Account",
logout:"🚪 Logout",
back:"⬅ Back",
nologin:"Not Logged In ❌",
logged:"LOGGED IN 😎",
captcha:"Complete CAPTCHA first 🔥"
},
jp:{
title:"👤 アカウント",
welcome:"アカウント作成 🔥",
desc:"LocalStorage に保存 😎",
save:"💾 保存",
logout:"🚪 ログアウト",
back:"⬅ 戻る",
nologin:"未ログイン ❌",
logged:"ログイン中 😎",
captcha:"CAPTCHA を完了してください 🔥"
},
ar:{
title:"👤 الحساب",
welcome:"إنشاء حساب 🔥",
desc:"حفظ الحساب 😎",
save:"💾 حفظ",
logout:"🚪 خروج",
back:"⬅ رجوع",
nologin:"غير مسجل ❌",
logged:"تم تسجيل الدخول 😎",
captcha:"أكمل CAPTCHA أولاً 🔥"
},
ru:{
title:"👤 Аккаунт",
welcome:"Создать аккаунт 🔥",
desc:"Сохранить аккаунт 😎",
save:"💾 Сохранить",
logout:"🚪 Выйти",
back:"⬅ Назад",
nologin:"Не вошли ❌",
logged:"ВОШЛИ 😎",
captcha:"Сначала CAPTCHA 🔥"
}
};

/* 🧠 APPLY LANG */
function applyLang(){

let t = text[lang];

document.getElementById("title").innerText = t.title;
document.getElementById("welcome").innerText = t.welcome;
document.getElementById("desc").innerText = t.desc;

document.getElementById("saveBtn").innerText = t.save;
document.getElementById("logoutBtn").innerText = t.logout;
document.getElementById("backBtn").innerText = t.back;

let username = localStorage.getItem("username");

document.getElementById("hasil").innerHTML =
username
? t.logged + "<br><br>" + username
: t.nologin;

localStorage.setItem("lang", lang);
}

/* 🌍 LANG */
function changeLang(v){
lang = v;
applyLang();
}

/* 🌙 DARK */
function toggleDark(){
document.body.classList.toggle("dark");
localStorage.setItem("dark",
document.body.classList.contains("dark") ? "on" : "off");
}

/* 💾 CREATE ACCOUNT */
function buatAkun(){

let captcha = document.querySelector('[name="cf-turnstile-response"]').value;

if(!captcha){
alert(text[lang].captcha);
return;
}

let username = document.getElementById("username").value;
let password = document.getElementById("password").value;

if(username === "" || password === ""){
alert("ISI SEMUA 🔥");
return;
}

localStorage.setItem("username", username);
localStorage.setItem("password", password);

document.getElementById("hasil").innerHTML =
text[lang].logged + "<br><br>" + username;

alert("AKUN DISIMPAN 🔥");
}

/* 🚪 LOGOUT */
function logout(){
localStorage.removeItem("username");
localStorage.removeItem("password");

document.getElementById("hasil").innerHTML = text[lang].nologin;

alert("LOGOUT 🔥");
}

/* INIT */
document.getElementById("langSelect").value = lang;
applyLang();

</script>

</body>
</html>
