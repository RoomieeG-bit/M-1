<!-- akun.html -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Akun - Warung Teh Tia</title>

<style>

:root{
  --bg:#fff8e7;
  --card:#ffffff;
  --text:#333;
  --primary:#ff9800;
}

body.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#f5f5f5;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:var(--primary);
  color:white;
  padding:25px;
  text-align:center;
  font-size:30px;
  font-weight:bold;
}

.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  padding:15px;
}

.container{
  padding:20px;
}

.card{
  max-width:500px;
  margin:auto;
  background:var(--card);
  padding:25px;
  border-radius:20px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

input{
  width:100%;
  padding:15px;
  margin-top:15px;
  border-radius:12px;
  border:none;
  background:#ececec;
  font-size:16px;
  box-sizing:border-box;
}

.btn{
  margin-top:15px;
  padding:14px 20px;
  border:none;
  border-radius:12px;
  background:var(--primary);
  color:white;
  cursor:pointer;
  font-size:16px;
}

#hasil{
  margin-top:20px;
  font-weight:bold;
}

</style>
</head>

<body>

<header id="title">
👤 Akun Warung Teh Tia
</header>

<div class="topbar">

<button class="btn"
onclick="history.back()"
id="backBtn">
⬅ Kembali
</button>

<button class="btn"
onclick="toggleDark()"
id="darkBtn">
🌙 Dark
</button>

<select onchange="changeLang(this.value)" id="langSelect">

<option value="id">
🇮🇩 Indonesia
</option>

<option value="en">
🇺🇸 English
</option>

<option value="jp">
🇯🇵 日本語
</option>

<option value="ar">
🇸🇦 العربية
</option>

<option value="ru">
🇷🇺 Русский
</option>

</select>

</div>

<div class="container">

<div class="card">

<h1 id="welcome">
Buat Akun 🔥
</h1>

<p id="desc">
Simpan akun ke localStorage 😎
</p>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button
class="btn"
onclick="buatAkun()"
id="saveBtn">

💾 Simpan Akun

</button>

<button
class="btn"
onclick="logout()"
id="logoutBtn">

🚪 Logout

</button>

<div id="hasil"></div>

</div>

</div>

<script>

let lang =
localStorage.getItem("lang") || "id";

let dark =
localStorage.getItem("dark") || "off";

if(dark === "on"){
  document.body.classList.add("dark");
}

const text = {

id:{
title:"👤 Akun Warung Teh Tia",
welcome:"Buat Akun 🔥",
desc:"Simpan akun ke localStorage 😎",
save:"💾 Simpan Akun",
logout:"🚪 Logout",
back:"⬅ Kembali",
saved:"AKUN BERHASIL DISIMPAN 🔥",
logged:"LOGIN SEBAGAI 😎"
},

en:{
title:"👤 Teh Tia Account",
welcome:"Create Account 🔥",
desc:"Save account to localStorage 😎",
save:"💾 Save Account",
logout:"🚪 Logout",
back:"⬅ Back",
saved:"ACCOUNT SAVED 🔥",
logged:"LOGGED IN AS 😎"
},

jp:{
title:"👤 アカウント",
welcome:"アカウント作成 🔥",
desc:"localStorage に保存 😎",
save:"💾 保存",
logout:"🚪 ログアウト",
back:"⬅ 戻る",
saved:"保存成功 🔥",
logged:"ログイン中 😎"
},

ar:{
title:"👤 الحساب",
welcome:"إنشاء حساب 🔥",
desc:"حفظ الحساب 😎",
save:"💾 حفظ",
logout:"🚪 تسجيل خروج",
back:"⬅ رجوع",
saved:"تم الحفظ 🔥",
logged:"تم تسجيل الدخول 😎"
},

ru:{
title:"👤 Аккаунт",
welcome:"Создать аккаунт 🔥",
desc:"Сохранить аккаунт 😎",
save:"💾 Сохранить",
logout:"🚪 Выйти",
back:"⬅ Назад",
saved:"СОХРАНЕНО 🔥",
logged:"ВОШЛИ КАК 😎"
}

};

function applyLang(){

let t = text[lang];

document.getElementById("title").innerText =
t.title;

document.getElementById("welcome").innerText =
t.welcome;

document.getElementById("desc").innerText =
t.desc;

document.getElementById("saveBtn").innerText =
t.save;

document.getElementById("logoutBtn").innerText =
t.logout;

document.getElementById("backBtn").innerText =
t.back;

localStorage.setItem("lang",lang);

let username =
localStorage.getItem("username");

if(username){

document.getElementById("hasil").innerHTML =
t.logged + "<br><br>" + username;

}

}

function changeLang(newLang){

lang = newLang;

applyLang();

}

function toggleDark(){

document.body.classList.toggle("dark");

localStorage.setItem(
"dark",
document.body.classList.contains("dark")
? "on"
: "off"
);

}

function buatAkun(){

let username =
document.getElementById("username").value;

let password =
document.getElementById("password").value;

if(username === "" || password === ""){
alert("ISI DULU 🔥");
return;
}

localStorage.setItem(
"username",
username
);

localStorage.setItem(
"password",
password
);

document.getElementById("hasil").innerHTML =
text[lang].logged +
"<br><br>" +
username;

alert(text[lang].saved);

}

function logout(){

localStorage.removeItem("username");

localStorage.removeItem("password");

document.getElementById("hasil").innerHTML =
"Logout sukses 🔥";

}

document.getElementById("langSelect").value =
lang;

applyLang();

</script>

</body>
</html>
