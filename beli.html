<!-- beli.html -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beli Produk - Warung Teh Tia</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f5f5f5;
    }

    header{
      background:#ff9800;
      color:white;
      text-align:center;
      padding:25px;
      font-size:32px;
      font-weight:bold;
    }

    .produk-container{
      padding:30px;
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .produk{
      background:white;
      padding:20px;
      border-radius:15px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .produk:hover{
      transform:scale(1.02);
    }

    .nama{
      font-size:25px;
      font-weight:bold;
      color:#333;
    }

    .harga{
      font-size:20px;
      color:#4caf50;
      margin-top:10px;
    }

    .jumlah{
      margin-top:15px;
    }

    input{
      padding:10px;
      width:70px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:16px;
    }

    .btn{
      display:inline-block;
      margin-top:15px;
      padding:10px 25px;
      background:#ff9800;
      color:white;
      text-decoration:none;
      border:none;
      border-radius:10px;
      transition:0.3s;
      cursor:pointer;
      font-size:16px;
    }

    .btn:hover{
      background:#e68900;
    }

    .bottom{
      padding:30px;
    }
  </style>
</head>
<body>

  <header>
    🛍️ Daftar Produk Warung Teh Tia
  </header>

  <div class="produk-container">

    <!-- Mie Goreng -->
    <div class="produk">

      <div class="nama">
        🍜 Mie Goreng
      </div>

      <div class="harga">
        Rp 3.000
      </div>

      <div class="jumlah">
        Jumlah:
        <input
        type="number"
        id="miegoreng"
        value="1"
        min="1">
      </div>

      <button
      class="btn"
      onclick="tambahKeranjang(
      'Mie Goreng',
      3000,
      document.getElementById('miegoreng').value
      )">

        Tambah ke Keranjang

      </button>

    </div>

    <!-- Mie Soto -->
    <div class="produk">

      <div class="nama">
        🍲 Mie Soto
      </div>

      <div class="harga">
        Rp 3.000
      </div>

      <div class="jumlah">
        Jumlah:
        <input
        type="number"
        id="miesoto"
        value="1"
        min="1">
      </div>

      <button
      class="btn"
      onclick="tambahKeranjang(
      'Mie Soto',
      3000,
      document.getElementById('miesoto').value
      )">

        Tambah ke Keranjang

      </button>

    </div>

    <!-- Telur -->
    <div class="produk">

      <div class="nama">
        🥚 Telur
      </div>

      <div class="harga">
        Rp 28.000
      </div>

      <div class="jumlah">
        Jumlah:
        <input
        type="number"
        id="telur"
        value="1"
        min="1">
      </div>

      <button
      class="btn"
      onclick="tambahKeranjang(
      'Telur',
      28000,
      document.getElementById('telur').value
      )">

        Tambah ke Keranjang

      </button>

    </div>

    <!-- Sabun -->
    <div class="produk">

      <div class="nama">
        🧼 Sabun Daia
      </div>

      <div class="harga">
        Rp 28.000
      </div>

      <div class="jumlah">
        Jumlah:
        <input
        type="number"
        id="sabun"
        value="1"
        min="1">
      </div>

      <button
      class="btn"
      onclick="tambahKeranjang(
      'Sabun Daia',
      28000,
      document.getElementById('sabun').value
      )">

        Tambah ke Keranjang

      </button>

    </div>

  </div>

  <div class="bottom">

    <a href="keranjang.html" class="btn">
      🛒 Lihat Keranjang
    </a>

    <br><br>

    <a href="index.html" class="btn">
      ⬅ Kembali
    </a>

  </div>

  <script>

    let keranjang =
    JSON.parse(localStorage.getItem("keranjang")) || [];

    function tambahKeranjang(nama, harga, jumlah){

      jumlah = parseInt(jumlah);

      let total = harga * jumlah;

      keranjang.push({
        nama: nama,
        harga: harga,
        jumlah: jumlah,
        total: total
      });

      localStorage.setItem(
        "keranjang",
        JSON.stringify(keranjang)
      );

      alert(
        nama +
        " berhasil ditambah 🔥\nJumlah: " +
        jumlah +
        "\nTotal: Rp " +
        total.toLocaleString("id-ID")
      );
    }

  </script>

</body>
</html>
