<!-- index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warung Teh Tia</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#fff8e7;
      text-align:center;
    }

    header{
      background:#ff9800;
      color:white;
      padding:30px;
      font-size:35px;
      font-weight:bold;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    .container{
      margin-top:80px;
    }

    h1{
      font-size:45px;
      color:#333;
    }

    p{
      color:#666;
      font-size:20px;
    }

    .btn{
      display:inline-block;
      margin-top:30px;
      margin-left:10px;
      margin-right:10px;
      padding:15px 40px;
      background:#ff9800;
      color:white;
      text-decoration:none;
      border-radius:15px;
      font-size:22px;
      transition:0.3s;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    .btn:hover{
      background:#e68900;
      transform:scale(1.05);
    }

    #status{
      margin-top:35px;
      font-size:25px;
      font-weight:bold;
      color:#333;
    }

    footer{
      margin-top:120px;
      padding:20px;
      background:#222;
      color:white;
    }
  </style>
</head>
<body>

  <header>
    🛒 Warung Teh Tia
  </header>

  <div class="container">

    <h1>Selamat Datang 👋</h1>

    <p>Website Grosir Termurah Se-Planet Bumi 🔥</p>

    <p>Semua Ada Disini! Tekan tombol beli untuk beli 😎</p>

    <div id="status">
      Belum Login ❌
    </div>

    <a href="beli.html" class="btn">
      Beli 🛍️
    </a>

    <a href="alamat.html" class="btn">
      Alamat Warung 🏬
    </a>

    <a href="akun.html" class="btn">
      Akun 👤
    </a>

  </div>

  <footer>
    © 2026 Warung Teh Tia
  </footer>

  <script>

    let username = localStorage.getItem("username");

    if(username){

      document.getElementById("status").innerHTML =
      "LOGIN SEBAGAI 😎<br><br>" + username;

    }

  </script>

</body>
</html>
