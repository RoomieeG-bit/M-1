<!-- index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warung Teh Tia</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#fff8e7;
      text-align:center;
    }

    header{
      background:#ff9800;
      color:white;
      padding:30px;
      font-size:35px;
      font-weight:bold;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    .container{
      margin-top:80px;
    }

    h1{
      font-size:45px;
      color:#333;
    }

    p{
      color:#666;
      font-size:20px;
    }

    .btn{
      display:inline-block;
      margin-top:30px;
      margin-left:10px;
      margin-right:10px;
      padding:15px 40px;
      background:#ff9800;
      color:white;
      text-decoration:none;
      border-radius:15px;
      font-size:22px;
      transition:0.3s;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
      cursor:pointer;
      border:none;
    }

    .btn:hover{
      background:#e68900;
      transform:scale(1.05);
    }

    #status{
      margin-top:35px;
      font-size:25px;
      font-weight:bold;
      color:#333;
    }

    footer{
      margin-top:120px;
      padding:20px;
      background:#222;
      color:white;
    }
  </style>
</head>

<body>

  <header id="title">
    🛒 Warung Teh Tia
  </header>

  <div class="container">

    <h1 id="welcome">Selamat Datang 👋</h1>

    <p id="desc1">Website Grosir Termurah Se-Planet Bumi 🔥</p>

    <p id="desc2">Semua Ada Disini! Tekan tombol beli untuk beli 😎</p>

    <div id="status">
      Belum Login ❌
    </div>

    <a href="beli.html" class="btn" id="btnBuy">
      Beli 🛍️
    </a>

    <a href="alamat.html" class="btn" id="btnAddr">
      Alamat Warung 🏬
    </a>

    <a href="akun.html" class="btn" id="btnAcc">
      Akun 👤
    </a>

    <br>

    <button class="btn" onclick="toggleLang()" id="langBtn">
      Ganti Bahasa 🌐
    </button>

  </div>

  <footer>
    © 2026 Warung Teh Tia
  </footer>

  <script>
    let username = localStorage.getItem("username");

    let lang = "id";

    const text = {
      id: {
        welcome: "Selamat Datang 👋",
        desc1: "Website Grosir Termurah Se-Planet Bumi 🔥",
        desc2: "Semua Ada Disini! Tekan tombol beli untuk beli 😎",
        buy: "Beli 🛍️",
        addr: "Alamat Warung 🏬",
        acc: "Akun 👤",
        statusDefault: "Belum Login ❌",
        langBtn: "Ganti Bahasa 🌐",
        title: "🛒 Warung Teh Tia"
      },
      en: {
        welcome: "Welcome 👋",
        desc1: "The Cheapest Wholesale Website on Earth 🔥",
        desc2: "Everything is here! Press buy button to shop 😎",
        buy: "Buy 🛍️",
        addr: "Shop Address 🏬",
        acc: "Account 👤",
        statusDefault: "Not Logged In ❌",
        langBtn: "Change Language 🌐",
        title: "🛒 Teh Tia Shop"
      }
    };

    function applyLang(){
      document.getElementById("welcome").innerText = text[lang].welcome;
      document.getElementById("desc1").innerText = text[lang].desc1;
      document.getElementById("desc2").innerText = text[lang].desc2;
      document.getElementById("btnBuy").innerText = text[lang].buy;
      document.getElementById("btnAddr").innerText = text[lang].addr;
      document.getElementById("btnAcc").innerText = text[lang].acc;
      document.getElementById("langBtn").innerText = text[lang].langBtn;
      document.getElementById("title").innerText = text[lang].title;

      if(username){
        document.getElementById("status").innerHTML =
        (lang === "id" ? "LOGIN SEBAGAI 😎<br><br>" : "LOGGED IN AS 😎<br><br>") + username;
      } else {
        document.getElementById("status").innerText = text[lang].statusDefault;
      }
    }

    function toggleLang(){
      lang = (lang === "id") ? "en" : "id";
      applyLang();
    }

    applyLang();
  </script>

</body>
</html>
