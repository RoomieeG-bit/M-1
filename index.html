<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warung Teh Tia</title>

<style>

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#fff8e7;
  text-align:center;
}

/* HEADER */
header{
  background:#ff9800;
  color:white;
  padding:30px;
  font-size:35px;
  font-weight:bold;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

/* CONTAINER */
.container{
  margin-top:60px;
}

h1{
  font-size:45px;
  color:#333;
}

p{
  color:#666;
  font-size:20px;
}

/* NAV SECTION (REFRACTORED) */
.nav{
  margin-top:30px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
}

/* BUTTON BASE */
.btn{
  padding:15px 30px;
  background:#ff9800;
  color:white;
  text-decoration:none;
  border-radius:15px;
  font-size:20px;
  transition:0.3s;
  cursor:pointer;
  border:none;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.btn:hover{
  background:#e68900;
  transform:scale(1.05);
}

/* STATUS CARD */
#status{
  margin-top:30px;
  font-size:22px;
  font-weight:bold;
  color:#333;
}

/* FOOTER */
footer{
  margin-top:100px;
  padding:20px;
  background:#222;
  color:white;
}

</style>
</head>

<body>

<header id="title">🛒 Warung Teh Tia</header>

<div class="container">

  <h1 id="welcome">Selamat Datang 👋</h1>

  <p id="desc1">Website Grosir Termurah Se-Planet Bumi 🔥</p>
  <p id="desc2">Semua Ada Disini! Tekan tombol beli untuk beli 😎</p>

  <div id="status">Belum Login ❌</div>

  <!-- NAV BAR CLEAN -->
  <div class="nav">

    <a href="beli.html" class="btn" id="btnBuy">Beli 🛍️</a>

    <a href="alamat.html" class="btn" id="btnAddr">Alamat 🏬</a>

    <a href="akun.html" class="btn" id="btnAcc">Akun 👤</a>

    <button class="btn" onclick="toggleLang()" id="langBtn">
      Ganti Bahasa 🌐
    </button>

  </div>

</div>

<footer>© 2026 Warung Teh Tia</footer>

<script>

/* STATE */
let lang = "id";
let username = localStorage.getItem("username");

/* TEXT MAP */
const text = {
  id: {
    welcome: "Selamat Datang 👋",
    desc1: "Website Grosir Termurah Se-Planet Bumi 🔥",
    desc2: "Semua Ada Disini! Tekan tombol beli untuk beli 😎",
    buy: "Beli 🛍️",
    addr: "Alamat 🏬",
    acc: "Akun 👤",
    status: "Belum Login ❌",
    langBtn: "Ganti Bahasa 🌐",
    title: "🛒 Warung Teh Tia",
    login: "LOGIN SEBAGAI 😎"
  },
  en: {
    welcome: "Welcome 👋",
    desc1: "The Cheapest Wholesale Website on Earth 🔥",
    desc2: "Everything is here! Press buy to shop 😎",
    buy: "Buy 🛍️",
    addr: "Address 🏬",
    acc: "Account 👤",
    status: "Not Logged In ❌",
    langBtn: "Change Language 🌐",
    title: "🛒 Teh Tia Shop",
    login: "LOGGED IN AS 😎"
  }
};

/* HELPER */
const setText = (id, value) =>
  document.getElementById(id).innerText = value;

/* APPLY LANGUAGE */
function applyLang(){

  const t = text[lang];

  setText("welcome", t.welcome);
  setText("desc1", t.desc1);
  setText("desc2", t.desc2);
  setText("btnBuy", t.buy);
  setText("btnAddr", t.addr);
  setText("btnAcc", t.acc);
  setText("langBtn", t.langBtn);
  setText("title", t.title);

  if(username){
    document.getElementById("status").innerHTML =
    `${t.login}<br><br>${username}`;
  } else {
    setText("status", t.status);
  }
}

/* TOGGLE LANGUAGE */
function toggleLang(){
  lang = (lang === "id") ? "en" : "id";
  applyLang();
}

/* INIT */
applyLang();

</script>

</body>
</html>
