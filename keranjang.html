<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keranjang - Warung Teh Tia</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
}

/* TOPBAR */
.topbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  align-items:center;
  background:#ff9800;
  padding:15px;
  position:sticky;
  top:0;
}

.topbar button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:white;
  cursor:pointer;
  font-weight:bold;
}

.topbar button:hover{
  background:#ffe0b2;
}

.topbar input{
  padding:10px;
  border:none;
  border-radius:10px;
  width:200px;
}

/* HEADER */
header{
  text-align:center;
  padding:20px;
  font-size:28px;
  font-weight:bold;
  background:white;
}

/* CARD */
.container{
  padding:25px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

/* LIST */
li{
  font-size:18px;
  margin-bottom:10px;
}

.kosong{
  color:gray;
}

/* BUTTON */
.btn{
  margin-top:10px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#ff9800;
  color:white;
}

.btn:hover{
  background:#e68900;
}

#totalHarga{
  margin-top:20px;
  font-weight:bold;
}

.hidden{
  display:none;
}

</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">

  <button onclick="location.href='beli.html'">⬅</button>

  <input type="text" id="search" placeholder="Cari item..." onkeyup="searchItem()">

  <button onclick="toggleLang()" id="langBtn">🌐 EN</button>

</div>

<header id="title">
  🛒 Keranjang Warung Teh Tia
</header>

<div class="container">

  <div class="card">

    <h2 id="head">Isi Keranjang 🔥</h2>

    <ul id="listKeranjang"></ul>

    <h3 id="totalHarga">Total Harga: Rp 0</h3>

    <button class="btn" onclick="checkoutWhatsApp()" id="checkoutBtn">
      Checkout WhatsApp 📱
    </button>

    <button class="btn" onclick="hapusKeranjang()" id="hapusBtn">
      Hapus Keranjang 🗑️
    </button>

  </div>

</div>

<script>

let lang="id";

let keranjang =
JSON.parse(localStorage.getItem("keranjang")) || [];

/* RENDER */
function tampilkanKeranjang(){

  let list=document.getElementById("listKeranjang");
  let totalHarga=document.getElementById("totalHarga");

  list.innerHTML="";

  let total=0;

  if(keranjang.length===0){
    list.innerHTML="<p class='kosong'>"+(lang==="id"?"Keranjang kosong 😭":"Cart is empty 😭")+"</p>";
    totalHarga.innerText=lang==="id"?"Total Harga: Rp 0":"Total Price: Rp 0";
    return;
  }

  keranjang.forEach(item=>{

    let subtotal=item.harga*item.jumlah;
    total+=subtotal;

    list.innerHTML+=`
      <li data-name="${item.nama.toLowerCase()}">
        ${item.nama} x${item.jumlah} = Rp ${subtotal.toLocaleString("id-ID")}
      </li>
    `;

  });

  totalHarga.innerText=
  (lang==="id"?"Total Harga: Rp ":"Total Price: Rp ")
  + total.toLocaleString("id-ID");

}

/* SEARCH */
function searchItem(){

  let q=document.getElementById("search").value.toLowerCase();

  document.querySelectorAll("#listKeranjang li").forEach(li=>{

    let name=li.getAttribute("data-name");

    li.style.display=name.includes(q)?"block":"none";

  });

}

/* CHECKOUT */
function checkoutWhatsApp(){

  if(keranjang.length===0){
    alert(lang==="id"?"Keranjang kosong 😭":"Cart empty 😭");
    return;
  }

  let pesan=lang==="id"
  ?"Halo Warung Teh Tia,%0ASaya mau beli:%0A"
  :"Hello Teh Tia Shop,%0AI want to buy:%0A";

  let total=0;

  keranjang.forEach(item=>{

    let sub=item.harga*item.jumlah;
    total+=sub;

    pesan+=`- ${item.nama} x${item.jumlah} = Rp ${sub.toLocaleString("id-ID")}%0A`;

  });

  pesan+=`%0A${lang==="id"?"Total":"Total"}: Rp ${total.toLocaleString("id-ID")}`;

  location.href="https://wa.me/6285820028734?text="+pesan;

}

/* CLEAR */
function hapusKeranjang(){

  localStorage.removeItem("keranjang");
  keranjang=[];

  tampilkanKeranjang();

  alert(lang==="id"?"Keranjang dihapus 🔥":"Cart cleared 🔥");

}

/* LANGUAGE */
function toggleLang(){

  lang=lang==="id"?"en":"id";

  document.getElementById("langBtn").innerText=lang==="id"?"🌐 EN":"🌐 ID";

  document.getElementById("title").innerText=
  lang==="id"?"🛒 Keranjang Warung Teh Tia":"🛒 Teh Tia Cart";

  document.getElementById("head").innerText=
  lang==="id"?"Isi Keranjang 🔥":"Cart Items 🔥";

  document.getElementById("checkoutBtn").innerText=
  lang==="id"?"Checkout WhatsApp 📱":"Checkout WhatsApp 📱";

  document.getElementById("hapusBtn").innerText=
  lang==="id"?"Hapus Keranjang 🗑️":"Clear Cart 🗑️";

  tampilkanKeranjang();

}

tampilkanKeranjang();

</script>

</body>
</html>
